name: Generate Signals

on:
  # Started by cron-job.org (stocks-signals): Mon/Wed/Fri 08:00 London.
  # No GitHub schedule; missed runs are caught by /health.
  workflow_dispatch:
    inputs:
      sector:
        description: 'Sector to generate signals for'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - AI
          - Defence
          - Crypto
          - groups

permissions:
  contents: write

concurrency:
  # main shares the bots' push lock; a branch run (it commits to its own branch) must not hold it up
  group: ${{ github.ref == 'refs/heads/main' && 'push-to-main' || format('signals-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # D1 secrets live in the `production` environment, which only `main` may use.
    # Branch runs get `preview` (no secrets): history goes to a throwaway local file.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at job start, not the triggering commit: a run queued behind
          # another bot must build on that bot's push, or it conflicts (21 Sept, #54)
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Themes that keep their own run. Biotech, Energy, Mega-Cap and Tech were retired (#88): the
      # Health Care, Energy and Technology sector runs and the S&P 500 page replace them.
      - name: Generate signals
        if: inputs.sector != 'groups'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          SECTOR="${{ inputs.sector }}"
          for s in AI Defence Crypto; do
            if [[ "${{ github.event_name }}" == "schedule" || "$SECTOR" == "all" || "$SECTOR" == "$s" ]]; then
              pip install -q -r $s/requirements.txt
              (cd $s && python ${s}_generate_signals_local.py)
            fi
          done

      # #88: the 11 sectors and the FTSE 100 (one AI run each, 4 at a time), then the S&P 500 and
      # Nasdaq-100 pages derived from the sector runs. A failure here can't stop the theme signals
      # above from being published; a failed group keeps its previous picks.
      - name: Generate group signals (sectors + FTSE 100)
        if: inputs.sector == 'all' || inputs.sector == 'groups' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install -q requests pyyaml tzdata
          python generate_group_signals.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SECTOR="${{ inputs.sector }}"
          LABEL="${SECTOR:-all sectors}"
          # main pushes to main; a branch run commits its output to its own branch (WORKFLOW.md
          # "Bot-code changes": the PR preview then shows real picks)
          TARGET="${{ github.ref_name }}"
          for f in markets/*/signals-local.js* sectors/*/signals-local.js*; do [ -e "$f" ] && git add "$f"; done
          FILES="AI/signals-local.json AI/signals-local.js Defence/signals-local.json Defence/signals-local.js Crypto/signals-local.json Crypto/signals-local.js"
          if git diff --cached --quiet && git diff --quiet -- $FILES; then
            echo "No signal changes."
          else
            git add $FILES
            git commit -m "Update signals — ${LABEL} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git fetch origin "$TARGET"
              git merge -X ours "origin/$TARGET" --no-edit
              git push origin "HEAD:$TARGET" && break
              echo "Push attempt $i failed, retrying..."
              sleep 10
            done
          fi

      # Dual-write (#54 step 3): signals are stored once and never changed (track record).
      - name: Record history (D1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
        run: python -m history.snapshot signals
