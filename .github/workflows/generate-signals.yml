name: Generate Signals

on:
  # Started by cron-job.org (stocks-signals): Mon/Wed/Fri 08:00 London.
  # No GitHub schedule; missed runs are caught by /health.
  workflow_dispatch:
    inputs:
      sector:
        description: 'Sector to generate signals for'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - AI
          - Biotech
          - Defence
          - Tech
          - Crypto
          - Energy
          - MegaCap

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # D1 secrets live in the `production` environment, which only `main` may use.
    # Branch runs get `preview` (no secrets): history goes to a throwaway local file.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at job start, not the triggering commit: a run queued behind
          # another bot must build on that bot's push, or it conflicts (21 Sept, #54)
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Generate signals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          SECTOR="${{ inputs.sector }}"
          for s in AI Biotech Defence Tech Crypto Energy MegaCap; do
            if [[ "${{ github.event_name }}" == "schedule" || "$SECTOR" == "all" || "$SECTOR" == "$s" ]]; then
              pip install -q -r $s/requirements.txt
              (cd $s && python ${s}_generate_signals_local.py)
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SECTOR="${{ inputs.sector }}"
          LABEL="${SECTOR:-all sectors}"
          if git diff --quiet -- AI/signals-local.json AI/signals-local.js Biotech/signals-local.json Biotech/signals-local.js Defence/signals-local.json Defence/signals-local.js Tech/signals-local.json Tech/signals-local.js Crypto/signals-local.json Crypto/signals-local.js Energy/signals-local.json Energy/signals-local.js MegaCap/signals-local.json MegaCap/signals-local.js; then
            echo "No signal changes."
          else
            git add AI/signals-local.json AI/signals-local.js
            git add Biotech/signals-local.json Biotech/signals-local.js
            git add Defence/signals-local.json Defence/signals-local.js
            git add Tech/signals-local.json Tech/signals-local.js
            git add Crypto/signals-local.json Crypto/signals-local.js
            git add Energy/signals-local.json Energy/signals-local.js
            git add MegaCap/signals-local.json MegaCap/signals-local.js
            git commit -m "Update signals — ${LABEL} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main --no-edit
              git push origin HEAD:main && break
              echo "Push attempt $i failed, retrying..."
              sleep 10
            done
          fi

      # Dual-write (#54 step 3): signals are stored once and never changed (track record).
      - name: Record history (D1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
        run: python -m history.snapshot signals
