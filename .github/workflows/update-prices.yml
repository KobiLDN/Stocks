name: Update Prices

on:
  # cron-job.org dispatches the runs at 07:30, 15:30 and 20:30 London time.
  # These UTC crons are a fallback only, set an hour after the winter slots
  # (two after the summer ones) so they never fire first; the freshness step
  # below skips them when the dispatched run has already landed.
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      sector:
        description: 'Sector to update prices for'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - AI
          - Biotech
          - Defence
          - Tech
          - Crypto
          - Energy
          - MegaCap

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at job start, not the triggering commit: a run queued behind
          # another bot must build on that bot's push, or it conflicts (21 Sept, #54)
          ref: ${{ github.ref }}

      # cron-job.org dispatches the price runs; this schedule is only a fallback.
      # A scheduled run that finds every sector updated in the last 4h skips, so
      # it no longer duplicates the dispatched run. 4h < the shortest gap between
      # dispatched runs (5h), so a missed dispatch is still covered.
      - name: Skip if prices are already fresh (scheduled runs only)
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          ldn = ZoneInfo("Europe/London")
          now = datetime.now(ldn)
          oldest = min(
              datetime.strptime(json.load(open(f"{s}/prices.json"))["updated"], "%Y-%m-%d %H:%M").replace(tzinfo=ldn)
              for s in ["AI", "Biotech", "Defence", "Tech", "Crypto", "Energy", "MegaCap"]
          )
          skip = now - oldest < timedelta(hours=4)
          print(f"Oldest sector update {oldest:%Y-%m-%d %H:%M} London ({now - oldest} ago) -> {'skip' if skip else 'run'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run price updaters
        if: steps.fresh.outputs.skip != 'true'
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}
        run: |
          SECTOR="${{ inputs.sector }}"
          for s in AI Biotech Defence Tech Crypto Energy MegaCap; do
            if [[ "${{ github.event_name }}" == "schedule" || "$SECTOR" == "all" || "$SECTOR" == "$s" ]]; then
              pip install -q -r $s/requirements.txt
              (cd $s && python ${s}_update_prices.py)
            fi
          done

      - name: Run market updater (SPY/QQQ/VIX)
        if: steps.fresh.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.sector == 'all')
        run: |
          pip install -q yfinance
          python update_market.py

      - name: Commit and push if changed
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SECTOR="${{ inputs.sector }}"
          LABEL="${SECTOR:-all sectors}"
          if git diff --quiet -- AI/index.html AI/prices.json AI/prices-data.js Biotech/index.html Biotech/prices.json Biotech/prices-data.js Defence/index.html Defence/prices.json Defence/prices-data.js Tech/prices.json Tech/prices-data.js Crypto/prices.json Crypto/prices-data.js Crypto/ytd_cache.json Energy/prices.json Energy/prices-data.js MegaCap/prices.json MegaCap/prices-data.js market.json market-data.js; then
            echo "No price changes."
          else
            git add AI/index.html AI/prices.json AI/prices-data.js
            git add Biotech/index.html Biotech/prices.json Biotech/prices-data.js
            git add Defence/index.html Defence/prices.json Defence/prices-data.js
            git add Tech/prices.json Tech/prices-data.js
            git add Crypto/prices.json Crypto/prices-data.js Crypto/ytd_cache.json
            git add Energy/prices.json Energy/prices-data.js
            git add MegaCap/prices.json MegaCap/prices-data.js
            git add market.json market-data.js
            git commit -m "Update prices — ${LABEL} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main --no-edit
              git push origin HEAD:main && break
              echo "Push attempt $i failed, retrying..."
              sleep 10
            done
          fi
