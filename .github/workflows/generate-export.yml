name: Generate Export

on:
  # Started by cron-job.org (stocks-export): Mon–Fri 21:30 London, after the
  # 20:30 price run. No GitHub schedule; missed runs are caught by /health.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at job start, not the triggering commit: a run queued behind
          # another bot must build on that bot's push, or it conflicts (21 Sept, #54)
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate export
        run: python generate_export.py

      - name: Prune old exports (keep last 30)
        run: |
          cd exports
          ls -t *.json 2>/dev/null | grep -v manifest | tail -n +31 | while read f; do
            rm -f "$f" "${f%.json}.csv"
            echo "Pruned $f"
          done

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          if git diff --staged --quiet; then
            echo "No changes to export files."
          else
            git commit -m "Update export — $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main --no-edit
              git push origin HEAD:main && break
              echo "Push attempt $i failed, retrying..."
              sleep 10
            done
          fi
