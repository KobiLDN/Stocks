name: Generate RSS News Feed

on:
  # Started by cron-job.org (stocks-news): Mon–Fri 08:35, 15:35, 20:35 London.
  # No GitHub schedule: it ran hours late and duplicated the dispatched run.
  # Missed runs are caught by /health (monitoring/freshness.js).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch tip at job start, not the triggering commit: a run queued behind
          # another bot must build on that bot's push, or it conflicts (21 Sept, #54)
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        working-directory: News
        run: pip install -r requirements.txt

      - name: Generate feed
        working-directory: News
        run: python generate_news_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add News/news-feed.json rss-data.js
          if git diff --cached --quiet -- News/news-feed.json rss-data.js; then
            echo "No changes to RSS feed."
          else
            git commit -m "Update RSS feed — $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4; do
              git fetch origin main
              git merge -X ours origin/main --no-edit
              git push origin HEAD:main && break
              echo "Push attempt $i failed, retrying..."
              sleep $((2 ** i))
            done
          fi
