  };

  /* Category display config for charts */
  const CHART_CATS = {
    'financials': {
      key: 'financials',
      label: "Financials",
      color: 'var(--accent)',
      btnLabel: "Financials",
      tooltip: "Financials stocks in the FTSE 100",
    },
    'industrials': {
      key: 'industrials',
      label: "Industrials",
      color: 'var(--purple)',
      btnLabel: "Industrials",
      tooltip: "Industrials stocks in the FTSE 100",
    },
    'consumer-discretionary': {
      key: 'consumer-discretionary',
      label: "Consumer Discretionary",
      color: 'var(--teal)',
      btnLabel: "Consumer Discretionary",
      tooltip: "Consumer Discretionary stocks in the FTSE 100",
    },
    'consumer-staples': {
      key: 'consumer-staples',
      label: "Consumer Staples",
      color: 'var(--rose)',
      btnLabel: "Consumer Staples",
      tooltip: "Consumer Staples stocks in the FTSE 100",
    },
    'materials': {
      key: 'materials',
      label: "Materials",
      color: 'var(--blue)',
      btnLabel: "Materials",
      tooltip: "Materials stocks in the FTSE 100",
    },
    'communication-services': {
      key: 'communication-services',
      label: "Communication Services",
      color: 'var(--green)',
      btnLabel: "Communication Services",
      tooltip: "Communication Services stocks in the FTSE 100",
    },
    'utilities': {
      key: 'utilities',
      label: "Utilities",
      color: 'var(--amber)',
      btnLabel: "Utilities",
      tooltip: "Utilities stocks in the FTSE 100",
    },
    'health-care': {
      key: 'health-care',
      label: "Health Care",
      color: 'var(--gold)',
      btnLabel: "Health Care",
      tooltip: "Health Care stocks in the FTSE 100",
    },
    'real-estate': {
      key: 'real-estate',
      label: "Real Estate",
      color: 'var(--lime)',
      btnLabel: "Real Estate",
      tooltip: "Real Estate stocks in the FTSE 100",
    },
    'technology': {
      key: 'technology',
      label: "Technology",
      color: 'var(--indigo)',
      btnLabel: "Technology",
      tooltip: "Technology stocks in the FTSE 100",
    },
    'energy': {
      key: 'energy',
      label: "Energy",
      color: 'var(--red)',
      btnLabel: "Energy",
      tooltip: "Energy stocks in the FTSE 100",
    },
  };

  function buildSidebar(stocks) {
    if (!stocks || !stocks.length) return;

    /* Build _chartCats from prices-data */
    window._chartCats = {};
    const catOrder = Object.keys(CHART_CATS);
    catOrder.forEach(catKey => {
      const cfg = CHART_CATS[catKey];
      const catStocks = stocks.filter(s => s.category === catKey);
      if (!catStocks.length) return;
      window._chartCats[catKey] = {
        label:  cfg.label,
        color:  cfg.color,
        stocks: catStocks.map(s => {
          const exchange = s.exchange === 'TSE' ? 'TSE' : s.exchange;
          const tvSym = TV_MAP[s.ticker] || (exchange + ':' + s.ticker);
          return { tv: tvSym, ticker: s.ticker, name: s.company_name || s.ticker };
        }),
      };
    });

    /* Populate sidebar */
    const container = document.getElementById('sidebar-stocks');
    container.innerHTML = '';
    catOrder.forEach(catKey => {
      const cat = window._chartCats[catKey];
      if (!cat) return;
      const cfg = CHART_CATS[catKey];
      const clsSuffix = CLS_SUFFIX[catKey] || catKey;
      const label = document.createElement('span');
      label.className = 'cat-label ' + clsSuffix;
      label.textContent = cfg.label;
      container.appendChild(label);
      cat.stocks.forEach(st => {
        const btn = document.createElement('button');
        btn.className = 'stock-btn';
        btn.dataset.tv   = st.tv;
        btn.dataset.name = st.name;
        btn.onclick = function() { loadSingle(this); };
        btn.innerHTML = '<span class="btn-ticker" style="color:' + cfg.color + '">' + st.ticker + '</span><span class="btn-name">' + st.name + '</span>';
        container.appendChild(btn);
      });
    });

    /* Populate category toolbar */
    const toolbar = document.getElementById('cat-toolbar-btns');
    toolbar.innerHTML = '';
    catOrder.forEach(catKey => {
      if (!window._chartCats[catKey]) return;
      const cfg = CHART_CATS[catKey];
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.textContent = cfg.btnLabel;
      if (cfg.tooltip) btn.setAttribute('data-tooltip', cfg.tooltip);
      btn.onclick = function() { setCategory(catKey, this); };
      toolbar.appendChild(btn);
    });
  }

  const tfMap = {
    '1W':  { interval: '60', range: '5D' },
    '1M':  { interval: 'D',  range: '1M' },
    '12M': { interval: 'W',  range: '12M' },
    '60M': { interval: 'M',  range: '60M' },
  };

  let currentView      = 'grid';
  let currentSymbol    = 'LSE:AZN';
  let currentName      = 'AstraZeneca';
  let currentTimeframe = '1W';
  let currentCategory  = null;

  /* ---- TIMEFRAME ---- */
  function setTimeframe(tf, btn) {
    document.querySelectorAll('.toolbar-group .tool-btn').forEach(b => {
      if (['1W','1M','1Y','5Y'].includes(b.textContent)) b.classList.remove('active');
    });
    btn.classList.add('active');
    currentTimeframe = tf;
    if (currentView === 'single') buildSingle();
    else if (currentCategory)    buildGrid(currentCategory);
  }

  /* ---- VIEW TOGGLE ---- */
  function setView(view) {
    currentView = view;
    document.getElementById('btn-single').classList.toggle('active', view === 'single');
    document.getElementById('btn-grid').classList.toggle('active', view === 'grid');
    document.getElementById('single-view').style.display = view === 'single' ? 'grid' : 'none';
    document.getElementById('grid-view').style.display   = view === 'grid'   ? 'block' : 'none';
    document.getElementById('cat-row').style.display     = view === 'grid'   ? 'flex' : 'none';
  }

  /* ---- SINGLE CHART ---- */
  const NO_EMBED = {
  };
  const CLS_SUFFIX = {};

  function fallbackHtml(tv) {
    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;font-family:'IBM Plex Mono',monospace;">
      <div style="font-size:13px;color:var(--muted);">Embedded chart not available for this symbol</div>
      <a href="${NO_EMBED[tv]}" target="_blank" style="font-size:12px;color:var(--accent);border:1px solid var(--accent);padding:8px 20px;text-decoration:none;letter-spacing:1px;">View on TradingView ↗</a>
    </div>`;
  }

  function buildSingle() {
    const widget = document.getElementById('single-widget');
    if (NO_EMBED[currentSymbol]) { widget.innerHTML = fallbackHtml(currentSymbol); return; }
    widget.innerHTML = '';
    const tf = tfMap[currentTimeframe];
    new TradingView.widget({
      container_id: 'single-widget',
      symbol: currentSymbol,
      interval: tf.interval,
      range: tf.range,
      timezone: 'Europe/London',
      theme: 'dark',
      style: '1',
      locale: 'en',
      enable_publishing: false,
      hide_side_toolbar: false,
      allow_symbol_change: false,
      save_image: false,
      height: 580,
      width: '100%',
      backgroundColor: '#000000',
      gridColor: 'rgba(0,212,255,0.04)',
    });
  }

  function loadSingle(btn) {
    document.querySelectorAll('.stock-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSymbol = btn.dataset.tv;
    currentName   = btn.dataset.name;
    document.getElementById('chart-ticker').textContent = btn.querySelector('.btn-ticker').textContent;
    document.getElementById('chart-name').textContent   = btn.dataset.name;
    buildSingle();
    // Auto-close sidebar on mobile after selection
    const sidebar = document.getElementById('sidebar');
    const toggle  = document.getElementById('sidebar-toggle');
    if (sidebar && window.innerWidth <= 768) {
      sidebar.classList.remove('open');
      toggle.textContent = '☰ Select Stock ▾';
    }
  }

  /* ---- CATEGORY GRID ---- */
  function setCategory(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => {
      b.className = b.className.replace(/active-\S+/g, '').trim();
    });
    btn.classList.add('active-' + cat);
    currentCategory = cat;
    buildGrid(cat);
  }

  function buildGrid(cat) {
    const data = window._chartCats[cat];
    const tf   = tfMap[currentTimeframe];
    const grid = document.getElementById('chart-grid');
    const heading = document.getElementById('grid-heading');

    heading.innerHTML = `<span>${data.label}</span> — ${data.stocks.length} stocks`;
    grid.innerHTML = '';

    data.stocks.forEach((stock, i) => {
      const containerId = `grid-chart-${i}`;
      const card = document.createElement('div');
      card.className = 'grid-card';
      card.innerHTML = `
        <div class="grid-card-header">
          <span class="grid-ticker" style="color:${data.color}">${stock.ticker}</span>
          <span class="grid-name">${stock.name}</span>
        </div>
        <div id="${containerId}" style="height:320px;"></div>
      `;
      grid.appendChild(card);

      if (NO_EMBED[stock.tv]) {
        document.getElementById(containerId).innerHTML = fallbackHtml(stock.tv);
        return;
      }

      // Stagger widget creation to avoid overwhelming the browser
      setTimeout(() => {
        new TradingView.widget({
          container_id: containerId,
          symbol: stock.tv,
          interval: tf.interval,
          range: tf.range,
          timezone: 'Europe/London',
          theme: 'dark',
          style: '1',
          locale: 'en',
          enable_publishing: false,
          hide_top_bar: false,
          hide_side_toolbar: true,
          allow_symbol_change: false,
          save_image: false,
          height: 320,
          width: '100%',
          backgroundColor: '#000000',
          gridColor: 'rgba(0,212,255,0.04)',
        });
      }, i * 150);
    });
  }

  /* ---- MOBILE SIDEBAR TOGGLE ---- */
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('sidebar-toggle');
    sidebar.classList.toggle('open');
    btn.textContent = sidebar.classList.contains('open') ? '✕ Close ▴' : '☰ Select Stock ▾';
  }

  /* ---- INIT ---- */
  window.addEventListener('load', () => {
    if (window.PRICES_DATA && window.PRICES_DATA.stocks) {
      buildSidebar(window.PRICES_DATA.stocks);
    }
    setView('grid');
    const firstCatBtn = document.querySelector('.cat-btn');
    if (firstCatBtn) {
      const firstCatKey = Object.keys(window._chartCats || {})[0] || 'memory';
      setCategory(firstCatKey, firstCatBtn);
    }
  });

  function openDrawer()  { document.getElementById('drawer-overlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); }
</script>
