  const CAT_LABELS = {
    'industrials': 'Industrials',
    'financials': 'Financials',
    'technology': 'Technology',
    'health-care': 'Health Care',
    'consumer-discretionary': 'Consumer Discretionary',
    'consumer-staples': 'Consumer Staples',
    'utilities': 'Utilities',
    'real-estate': 'Real Estate',
    'materials': 'Materials',
    'communication-services': 'Communication Services',
    'energy': 'Energy',
  };

  function fmtUsd(val) {
    if (val >= 1000) return '$' + val.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (val >= 10)   return '$' + val.toFixed(0);
    return '$' + val.toFixed(2);
  }

  function fmtPl(val) {
    const sign = val >= 0 ? '+' : '';
    if (Math.abs(val) >= 1000) return sign + '$' + Math.abs(val).toLocaleString('en-US', { maximumFractionDigits: 0 }) + (val < 0 ? ' loss' : ' gain');
    return sign + '$' + Math.abs(val).toFixed(2) + (val < 0 ? ' loss' : ' gain');
  }

  function invCell(invested, ytdPct) {
    const current = invested * (1 + ytdPct / 100);
    const pl = current - invested;
    const cls = ytdPct > 0 ? 'pos' : ytdPct < 0 ? 'neg' : '';
    return `<td class="inv-cell">
      <span class="inv-value ${cls}">${fmtUsd(current)}</span>
      <span class="inv-pl ${cls}">${fmtPl(pl)}</span>
    </td>`;
  }

  /* ---- SORT ---- */
  let sortState = { col: 'ytd', dir: -1 };

  function multCell(ytdPct) {
    const m = 1 + ytdPct / 100;
    const cls = ytdPct > 0 ? 'pos' : ytdPct < 0 ? 'neg' : 'flat';
    return `<td class="mult-cell"><span class="mult-value ${cls}">${m.toFixed(2)}×</span></td>`;
  }

  function sortCalc(col, th) {
    if (sortState.col === col) sortState.dir *= -1;
    else { sortState.col = col; sortState.dir = (col === 'ytd' || col === 'mult') ? -1 : 1; }
    document.querySelectorAll('#calc-table thead th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
    th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
    renderTable(window._calcData);
  }

  /* ---- FILTER ---- */
  let activeCategory = 'all';
  let activeQuery    = '';

  function buildFilterBar() {
    const bar = document.getElementById('filter-bar');
    if (!bar) return;
    const cats = ['all', ...Object.keys(CAT_LABELS)];
    bar.innerHTML = cats.map(cat => {
      const label = cat === 'all' ? 'All' : (CAT_LABELS[cat] || cat);
      return '<button class="filter-btn' + (cat === activeCategory ? ' active' : '') +
             '" data-cat="' + cat + '" onclick="setCategory(\'' + cat + '\')">' + label + '</button>';
    }).join('');
  }

  function setCategory(cat) {
    activeCategory = cat;
    document.querySelectorAll('#filter-bar .filter-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.cat === cat));
    applyFilters();
  }

  function filterCalc(query) {
    activeQuery = query.toLowerCase().trim();
    applyFilters();
  }

  function applyFilters() {
    let data = window._calcData;
    if (activeCategory !== 'all') data = data.filter(s => s.category === activeCategory);
    if (activeQuery) data = data.filter(s =>
      s.ticker.toLowerCase().includes(activeQuery) || s.name.toLowerCase().includes(activeQuery));
    renderTable(data);
  }

  /* ---- RENDER ---- */
  function renderTable(data) {
    const sorted = [...data].sort((a, b) => {
      if (sortState.col === 'ticker') return a.ticker.localeCompare(b.ticker) * sortState.dir;
      return (a.ytdPct - b.ytdPct) * sortState.dir;
    });

    document.getElementById('calc-count').textContent = data.length;
    const body = document.getElementById('calc-body');
    body.innerHTML = sorted.map(s => {
      const ytdCls = s.ytdPct > 0 ? 'ytd-pos' : s.ytdPct < 0 ? 'ytd-neg' : 'ytd-flat';
      const catLabel = CAT_LABELS[s.category] || s.category;
      return `<tr>
        <td class="ticker-cell"><a href="${assetUrl(s.ticker)}" target="_blank" class="ticker-link">${s.ticker}</a></td>
        <td class="company-cell">${s.name}</td>
        <td><span class="cat-badge cat-${s.category}">${catLabel}</span></td>
        <td><span class="${ytdCls}">${s.ytdPct >= 0 ? '+' : ''}${s.ytdPct.toFixed(2)}%</span></td>
        ${multCell(s.ytdPct)}
        ${invCell(100, s.ytdPct)}
        ${invCell(1000, s.ytdPct)}
        ${invCell(10000, s.ytdPct)}
      </tr>`;
    }).join('');

    // Totals
    const totals = [100, 1000, 10000].map(inv => {
      const total = data.reduce((sum, s) => sum + inv * (1 + s.ytdPct / 100), 0);
      const pl = total - inv * data.length;
      const cls = pl >= 0 ? 'pos' : 'neg';
      return `<td class="inv-cell">
        <span class="inv-value ${cls}">${fmtUsd(total)}</span>
        <span class="inv-pl ${cls}">${fmtPl(pl)}</span>
      </td>`;
    }).join('');

    document.getElementById('calc-foot').innerHTML = `<tr class="totals-row">
      <td colspan="3"><span class="totals-label">Total (${data.length} stocks)</span></td>
      <td></td><td></td>
      ${totals}
    </tr>`;
  }

  /* ---- INIT ---- */
  function buildCalc(stocks) {
    const data = stocks
      .map(s => ({
        ticker:   s.ticker,
        name:     s.company_name || NAMES[s.ticker] || s.ticker,
        category: s.category,
        ytdPct:   parseFloat(s.change_ytd) || 0,
      }))
      .filter(s => s.ytdPct !== 0);

    window._calcData = data;
    const _ct = document.getElementById('calc-total'); if (_ct) _ct.textContent = data.length;
    buildFilterBar();
    applyFilters();
  }

  if (window.PRICES_DATA) {
    buildCalc(window.PRICES_DATA.stocks);
  } else {
    fetch('prices.json')
      .then(r => r.json())
      .then(data => buildCalc(data.stocks))
      .catch(() => {
        document.getElementById('calc-body').innerHTML =
          '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted);font-family:\'IBM Plex Mono\',monospace;">No price data available — run the price bot first.</td></tr>';
      });
  }

  function openDrawer()  { document.getElementById('drawer-overlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); }

</script>
