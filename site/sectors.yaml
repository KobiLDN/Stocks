    notes:
    - id: BTC
      text: Bitcoin — the original decentralised digital currency. Largest crypto asset by market cap. Hard-capped at 21 million coins.
    - id: ETH
      text: Ethereum — the leading smart-contract platform. Proof-of-stake since the Merge (2022). Home to the majority of DeFi, NFT, and L2 activity.
    - id: SOL
      text: Solana — high-throughput L1. Fast, low-cost transactions via proof-of-history. Growing DeFi and consumer app ecosystem.
    - id: BNB
      text: BNB — native token of BNB Chain. Used for trading fee discounts on Binance and powering the BSC DeFi ecosystem.
    - id: ADA
      text: Cardano — peer-reviewed proof-of-stake L1. Academic, rigorous development approach. Growing DeFi ecosystem via Plutus smart contracts.
    - id: AVAX
      text: Avalanche — high-speed L1 with subnet architecture. Sub-second finality. Competing with Ethereum for institutional DeFi and gaming.
    - id: XRP
      text: XRP — Ripple Labs payment token. Designed for fast, low-cost cross-border settlement. SEC lawsuit resolved; growing institutional adoption.
    - id: XLM
      text: Stellar — open-source payment network for cross-border transactions. XLM token. Backed by Stellar Development Foundation; IBM World Wire partner.
    - id: TRX
      text: TRON — high-throughput blockchain. Largest USDT settlement network by volume. Focus on digital content, DeFi, and stablecoin payments.
    - id: SUI
      text: Sui — Move-based L1 from Mysten Labs (ex-Diem/Facebook). Parallel transaction execution for high throughput. Focus on gaming and consumer apps.
    - id: HBAR
      text: Hedera — enterprise-grade public ledger using hashgraph consensus. Governed by Google, IBM, Boeing and others. Fast, energy-efficient, low fees.
    - id: TON
      text: Toncoin — The Open Network. Telegram-backed blockchain with 900M+ Telegram users as potential on-ramp. Native payments and mini-apps in Telegram.
    - id: ALGO
      text: Algorand — pure proof-of-stake L1. Instant finality, carbon-negative. Used for CBDC pilots and real-world asset tokenisation. Academic origins.
    - id: MINA
      text: Mina Protocol — the world's lightest blockchain (~22KB constant size). ZK-proofs maintain chain state. Focus on privacy and decentralised identity.
    - id: POL
      text: Polygon — Ethereum L2 and scaling network. PoS chain and zkEVM rollup. Token rebranded from MATIC to POL in 2024. Large enterprise and gaming adoption.
    - id: DOT
      text: Polkadot — multi-chain relay network enabling blockchain interoperability. Parachain architecture. Web3 Foundation-backed. Substrate framework.
    - id: LINK
      text: Chainlink — the leading decentralised oracle network. Connects smart contracts to real-world data, APIs, and off-chain computation. Critical DeFi infrastructure.
    - id: DOGE
      text: Dogecoin — the original meme coin. Strong retail community. Accepted by Tesla and SpaceX. Elon Musk endorsements drive recurring price action.
    - id: PEPE
      text: Pepe — Ethereum-based meme token inspired by Pepe the Frog. Launched April 2023. No utility — pure community and speculative momentum play.
    - id: TAO
      text: Bittensor — decentralised AI/ML marketplace where models compete and earn TAO for providing intelligence. Largest AI crypto by market cap (~$3.4B).
    - id: FET
      text: Artificial Superintelligence Alliance (ASI) — merger of Fetch.ai, SingularityNET, and Ocean Protocol. Autonomous AI agents for DeFi, data markets, and automation.
    - id: RNDR
      text: Render Network — decentralised GPU marketplace for AI rendering, inference, and 3D visual compute. Artists and AI workloads rent GPU power from node operators.
    - id: OCEAN
      text: Ocean Protocol — data marketplace enabling secure sharing and monetisation of datasets. Critical infrastructure for training AI models at scale.
    - id: GRT
      text: The Graph — "Google for Web3". Decentralised indexing protocol providing structured on-chain data essential for AI analytics and on-chain intelligence.
    - id: AGIX
      text: SingularityNET — AGI research and AI services marketplace co-founded by Ben Goertzel. Developers publish and monetise AI algorithms as microservices.
    - id: NMR
      text: Numeraire — Numerai hedge fund token. Data scientists stake NMR when submitting AI predictions to a global tournament; correct predictions earn returns.
    - id: ALT
      text: AltLayer — AI-powered rollup infrastructure using restaking. Enables one-click deployment of verifiable rollup networks for developers and enterprises.
    - id: AIOZ
      text: AIOZ Network — decentralised AI and media streaming CDN. GPU node operators earn AIOZ for streaming video and handling AI compute workloads.
    - id: ARKM
      text: Arkham Intelligence — on-chain analytics and intelligence exchange. ARKM tokens used to buy and sell intelligence on crypto wallets and entities.
    - id: WLD
      text: Worldcoin — Sam Altman's identity and AI project. Uses iris biometrics (the Orb device) to verify humanhood as AI becomes indistinguishable from people.
    - id: NEAR
      text: NEAR Protocol — AI-ready Layer 1 with chain abstraction. Positions itself as the execution layer for autonomous AI agents operating across multiple blockchains.
    - id: ICP
      text: Internet Computer — Dfinity's blockchain that runs AI models and smart contracts directly on-chain without traditional cloud infrastructure.
    - id: KAITO
      text: Kaito — AI-powered crypto research and intelligence platform. Aggregates and ranks the most relevant information across Web3 using AI.
    - id: VIRTUAL
      text: Virtuals Protocol — tokenised AI agent economies. Each AI agent has an economic identity, can earn revenue, and is co-owned by its community via token.
