    notes:
    - id: SNDK
      text: NAND pure-play. AI storage supercycle. Spun off WDC 2025.
    - id: WDC
      text: HDD duopoly. Fully committed to hyperscalers through FY end.
    - id: 285A
      text: 'SNDK''s JV partner. Pure NAND play. Japan listed — needs specialist broker. US OTC: KXIAY (T212 ISA alias).'
    - id: MU
      text: DRAM + NAND + HBM. Sold out of HBM for all of 2026. 11.5x fwd P/E.
    - id: STX
      text: HDD duopoly with WDC. AI data centre mass storage.
    - id: MRVL
      text: Custom silicon + AI networking. 800G/1.6T optical interconnects.
    - id: P
      text: Formerly Pure Storage (PSTG). Rebranded to Everpure, ticker changed to P, Apr 2026. AI data management platform.
    - id: RR.
      text: UK SMR contract signed Apr 2026. Wylfa, Anglesey — 3 units. Also jets + defence.
    - id: CEG
      text: Largest US nuclear operator. 21 reactors. 20yr deals with Meta & Microsoft.
    - id: VST
      text: Nuclear + gas + retail. 6.5GW nuclear capacity. 5M retail customers.
    - id: TLN
      text: 1,920MW to AWS through 2042. Data centre campus on-site.
    - id: BEP
      text: 51% owner of Westinghouse — services 50% of world's nuclear plants.
    - id: BEPC
      text: Corporate share class of BEP. Same Westinghouse exposure. More liquid than LP units.
    - id: GEV
      text: BWRX-300 SMR — first in Western hemisphere (Ontario). GE Hitachi JV.
    - id: BWXT
      text: Sole US Navy reactor maker. "Foundry for SMRs." $7.3B backlog, +50% YoY.
    - id: SMR
      text: Only NRC-certified SMR design. 77MWe modules. TVA 6GW deal. Speculative.
    - id: OKLO
      text: Sam Altman-backed. Fast-fission + waste recycling. -75% from ATH of $189.
    - id: NNE
      text: 'Microreactors: KRONOS, ZEUS, LOKI. Space nuclear mandate catalyst. Pre-revenue.'
    - id: CCJ
      text: World's largest uranium miner. Also 49% owner of Westinghouse.
    - id: UEC
      text: US-focused uranium miner. Lower entry price. Higher volatility.
    - id: LEU
      text: Only licensed US supplier of HALEU fuel for advanced reactors. Strategic monopoly.
    - id: VRT
      text: Data centre cooling & power management. Every AI data centre needs this.
    - id: ETN
      text: Electrical components & transformers. Grid infrastructure backbone.
    - id: POWL
      text: Switchgear & electrical infrastructure. Less-known but strong AI tailwind.
    - id: EQIX
      text: Largest global colocation provider. 260+ data centres, 70 metros worldwide.
    - id: DLR
      text: Major DC REIT. 300+ facilities across 25 countries. AI demand driving occupancy.
    - id: AMT
      text: Tower REIT expanding into edge compute. 220,000+ sites globally.
    - id: GOOGL
      text: Google Cloud + TPU AI chips. $75B capex planned for 2026 data centres.
    - id: MSFT
      text: Azure + OpenAI partnership. $80B data centre capex in 2026. Copilot monetisation.
    - id: AMZN
      text: AWS dominates cloud AI infra. Trainium & Inferentia custom AI chips. Bedrock platform.
    - id: META
      text: $65B AI capex 2026. Llama open-source models. Building 2GW data centre campus.
    - id: IREN
      text: Pivoting from Bitcoin mining to AI GPU compute. Renewable-powered data centres.
    - id: CORZ
      text: Crypto→AI pivot. 200MW CoreWeave HPC deal. Emerged from bankruptcy 2023.
    - id: WULF
      text: Nuclear-powered Bitcoin/AI compute. 95% zero-carbon. Building HPC capacity.
    - id: HUT
      text: Bitcoin mining + AI compute pivot. US HPC expansion. High volatility.
    - id: SMCI
