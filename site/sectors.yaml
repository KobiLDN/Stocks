      label: Materials
    cat_tooltips:
    - id: memory
      text: DRAM, NAND flash & storage hardware — the memory layer that feeds AI accelerators
    - id: nuclear-ops
      text: Utilities operating nuclear power plants — clean 24/7 baseload electricity for data centres
    - id: smr
      text: Small Modular Reactor developers — compact next-gen nuclear designed for on-site data centre power
    - id: uranium
      text: Uranium miners & enrichers — upstream fuel supply benefiting from the nuclear power revival
    - id: power-infra
      text: Switchgear, transformers & power management — the grid buildout infrastructure behind every data centre
    - id: dc-operators
      text: Companies that own and operate the physical data centre facilities where AI compute is housed
    - id: hyperscalers
      text: Mega cloud platforms (AWS, Azure, Google) building AI infrastructure at planetary scale
    - id: ai-compute
      text: GPU and AI accelerator makers — the silicon that runs AI training and inference workloads
    - id: fibre-optical
      text: High-speed optical networking and fibre interconnects — the data links between and within data centres
    - id: dsp-semi
      text: Specialised semiconductors for digital signal processing and high-speed networking silicon
    - id: test-equip
      text: Electronic test & measurement gear used to validate chips, networks and power systems
    - id: materials
      text: Specialty substrates and compound semiconductors used in chip and optical component manufacturing
    tip_overrides:
      price:
        title: Price
        tip: Current share price converted to GBP. The live price the rest of this dashboard's calculations are based on.
      market_cap:
        title: Market Cap
        tip: Total market value of all outstanding shares, converted to GBP. A rough measure of company size — larger cap generally means more stable, smaller cap means higher growth potential but more risk.
      ytd:
        title: YTD Return
        tip: Year-to-date price change from the first trading day of 2026. Shows how much the stock has gained or lost since January — the core performance measure for this dashboard.
      beta:
        title: Beta
        tip: Measures how volatile a stock is relative to the broader market. Beta &gt; 1 means it moves more than the market — higher reward but higher risk. Beta &lt; 1 means it's more stable. Most AI infrastructure stocks are high beta.
      pe_ratio:
        title: P/E Ratio
        tip: Price-to-Earnings ratio — how much investors pay per $1 of profit. A high P/E means the market expects strong future growth. Loss-making companies (common in this sector) show — as there are no earnings to divide by.
      avg_volume:
        title: Avg Daily Volume
        tip: Average number of shares traded per day over the past 3 months. Higher volume means it's easier to buy or sell without moving the price — a sign of liquidity and investor interest.
      vol_1d:
        title: 1-Day Volume
        tip: Total number of shares traded in the most recent trading session. Compare to Avg Vol to see if today was unusually busy — a spike often signals news, earnings, or a big price move.
      vol_1w:
        title: 1-Week Volume
        tip: Total shares traded across the last 5 trading days. Higher than usual weekly volume can indicate growing investor interest or a reaction to recent news.
      vol_1m:
        title: 1-Month Volume
        tip: Total shares traded over the past month (approx. 20 trading days). Useful for spotting longer-term shifts in investor attention compared to the 3-month average.
      div_yield:
        title: Dividend Yield
        tip: Annual dividend paid as a percentage of the current share price. Most high-growth AI infrastructure stocks reinvest profits rather than pay dividends, so this is — for the majority. REITs and utilities tend to pay more.
      short_pct:
        title: Short Interest
        tip: Percentage of available shares currently sold short — investors betting the price will fall. High short interest (above 10%) can signal bearish sentiment, but can also lead to a short squeeze if the stock rises sharply.
      analyst_score:
        title: Analyst Rating
        tip: Consensus recommendation from Wall Street analysts, ranging from Strong Buy to Sell. Based on the average of all analyst ratings covering the stock. Take with a pinch of salt — analysts are often slow to downgrade.
