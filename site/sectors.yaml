metrics_base_tips:
  price:
    tip: Current share price converted to GBP.
    title: Price
  market_cap:
    tip: Total market value of all outstanding shares, converted to GBP billions.
    title: Market Cap
  ytd:
    tip: Year-to-date price change from the first trading day of 2026.
    title: YTD Return
  change_1d:
    tip: Price change over the last trading session.
    title: 1-Day Return
  change_1w:
    tip: Price change over the last 5 trading days.
    title: 1-Week Return
  change_1m:
    tip: Price change over the last month.
    title: 1-Month Return
  beta:
    tip: Measures how volatile a stock is relative to the broader market. Beta &gt; 1 means it moves more than the market.
    title: Beta
  pe_ratio:
    tip: Price-to-Earnings ratio. A high P/E means the market expects strong future growth. Loss-making companies show —.
    title: P/E Ratio
  avg_volume:
    tip: Average number of shares traded per day over the past 3 months. Higher volume = better liquidity.
    title: Avg Daily Volume
  vol_1d:
    tip: Total shares traded in the most recent session. Compare to Avg Vol to spot unusual activity.
    title: 1-Day Volume
  vol_1w:
    tip: Total shares traded across the last 5 trading days.
    title: 1-Week Volume
  vol_1m:
    tip: Total shares traded over the past month (~20 trading days).
    title: 1-Month Volume
  div_yield:
    tip: Annual dividend paid as a percentage of the current share price.
    title: Dividend Yield
  short_pct:
    tip: Percentage of shares sold short. High short interest (above 10%) can signal bearish sentiment.
    title: Short Interest
  analyst_score:
    tip: Consensus recommendation from Wall Street analysts, ranging from Strong Buy to Sell.
    title: Analyst Rating
