    - GitHub Actions runs <code>AI_update_prices.py</code> daily. It fetches live prices, 1D/1W/1M/YTD returns, P/E, short interest, analyst scores and up to 5 recent headlines with sentiment scores for all 48 stocks via Yahoo Finance.
    - Before ranking, the model is directed to search online for the latest news on the top 10 highest-momentum stocks — surfacing deal announcements, analyst upgrades, earnings surprises and price target changes that happened since the last data pull.
    - <code>AI_generate_signals_local.py</code> sends the full dataset to <code>deepseek/deepseek-v4-flash</code> via OpenRouter with the web search plugin enabled. The model scores each stock across momentum, fundamentals, analyst consensus and live news sentiment, then returns a ranked top 10 in JSON.
    - The full pipeline runs automatically every Monday, Wednesday and Friday. You can also trigger it manually from the GitHub Actions tab, or run <code>python AI_generate_signals_local.py</code> locally to generate fresh signals on demand.
    disclaimer: The model can be wrong, biased toward recent momentum, or inconsistent run-to-run. Confidence scores are the model's own estimate, not a guarantee. Signals are one input among many — always do your own research before making any investment decision.
