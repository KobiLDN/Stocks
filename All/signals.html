<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Every AI pick on the site in one list: the 11 sector runs, the FTSE 100, AI, Defence and Crypto. A stock picked by several runs shows once.">
<title>All Sectors — Signals</title>
<script>if(localStorage.getItem('theme')==='dark'||(localStorage.getItem('theme')===null&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 5px 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { color: var(--accent); border-color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .filter-btn[data-filter="ai"].active      { background: var(--accent);  border-color: var(--accent); }
  .filter-btn[data-filter="biotech"].active { background: var(--green);   border-color: var(--green);  color: var(--bg); }
  .filter-btn[data-filter="defence"].active { background: var(--rose);    border-color: var(--rose);   color: var(--bg); }
  .filter-btn[data-filter="tech"].active    { background: var(--indigo);  border-color: var(--indigo); color: #fff; }
  .filter-btn[data-filter="crypto"].active  { background: var(--gold);    border-color: var(--gold);   color: var(--bg); }
  .filter-btn[data-filter="energy"].active  { background: var(--amber);   border-color: var(--amber);  color: var(--bg); }
  .filter-btn[data-filter="megacap"].active { background: #f472b6; border-color: #f472b6; color: var(--bg); }

  .sector-block { margin-bottom: 48px; }
  .sector-heading {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .sector-heading-icon { font-size: 22px; }
  .sector-heading h2 { font-size: 18px; font-weight: 800; margin: 0; }
  .sector-heading .sector-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }

  .how-toggle {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 20px; transition: color 0.15s;
  }
  .how-toggle:hover { color: var(--accent); }
  .how-toggle .toggle-icon { font-size: 12px; transition: transform 0.2s; }
  .how-toggle.open .toggle-icon { transform: rotate(90deg); }
  .how-box {
    display: none; background: var(--surface); border: 1px solid var(--border);
    padding: 16px 20px; margin-bottom: 20px;
    font-size: 13px; color: var(--muted); line-height: 1.7;
  }
  .how-box.open { display: block; }
  .how-box strong { color: var(--text); }

  .picks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 24px; }

  .signal-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 16px 18px; display: flex; align-items: flex-start; gap: 14px;
    transition: border-color 0.15s;
  }
  .signal-card:hover { border-color: var(--accent); }

  .rank-num { font-size: 28px; font-weight: 800; color: var(--accent); font-family: 'IBM Plex Mono', monospace; min-width: 36px; }

  .signal-body { flex: 1; }
  .signal-ticker { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700; }
  .signal-name { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .signal-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .cat-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; letter-spacing: 0.5px; font-weight: 600; }
  .sector-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 7px; letter-spacing: 0.5px; font-weight: 600; }
  .sector-ai      { background: rgba(0,212,255,0.1);   color: var(--accent); border: 1px solid rgba(0,212,255,0.25); }
  .sector-biotech { background: rgba(0,230,118,0.1);   color: var(--green);  border: 1px solid rgba(0,230,118,0.25); }
  .sector-defence { background: rgba(251,113,133,0.1); color: var(--rose);   border: 1px solid rgba(251,113,133,0.25); }
  .sector-tech    { background: rgba(167,139,250,0.1); color: var(--indigo); border: 1px solid rgba(167,139,250,0.25); }
  .sector-crypto  { background: rgba(255,215,0,0.1);   color: var(--gold);   border: 1px solid rgba(255,215,0,0.25); }
  .sector-energy  { background: rgba(245,158,11,0.1);  color: var(--amber);  border: 1px solid rgba(245,158,11,0.25); }
  .sector-megacap { background: rgba(244,114,182,0.12); color: #f472b6; border: 1px solid rgba(244,114,182,0.3); }

  .signal-pill { margin-left: auto; }
  .rank-delta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 2px; }
  .delta-new  { background: rgba(0,212,255,0.15); color: var(--accent); border: 1px solid rgba(0,212,255,0.3); }
  .delta-up   { background: rgba(0,230,118,0.15); color: var(--green);  border: 1px solid rgba(0,230,118,0.3); }
  .delta-down { background: rgba(255,68,68,0.15); color: var(--red);    border: 1px solid rgba(255,68,68,0.3); }
  .delta-same { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

  .signal-score { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .signal-score span { color: var(--text); font-weight: 700; }

  .momentum-section { margin-top: 10px; }
  .section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
  }
  .momentum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .momentum-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 12px 14px; transition: border-color 0.15s;
  }
  .momentum-card:hover { border-color: var(--accent); }
  .momentum-ticker { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; }
  .momentum-name { font-size: 11px; color: var(--muted); }
  .momentum-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .momentum-score { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .momentum-score span { color: var(--green); font-weight: 700; }

  .updated-row { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 24px; }
  .updated-row span { color: var(--text); }

  .empty-block { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); padding: 20px 0; }

  /* ─── 3-Panel Layout ─── */
  body[data-layout="rail"] { flex-direction: row; }
  .right-side { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .nav-panel {
    width: 148px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--bg); display: flex; flex-direction: column;
    padding: 8px 0; overflow-y: auto; scrollbar-width: none;
  }
  .nav-panel::-webkit-scrollbar { display: none; }
  .nav-item { display: flex; flex-direction: column; }
  .nav-panel .nav-link {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; padding: 10px 14px; color: var(--dim);
    border: none; border-left: 2px solid transparent; text-decoration: none;
    display: flex; align-items: center; gap: 8px; transition: all 0.15s;
    cursor: pointer; background: none; width: 100%; text-align: left;
  }
  .nav-panel .nav-link.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface2); }
  .nav-panel .nav-link:hover  { color: var(--accent); background: var(--surface2); }
  .nav-icon  { font-size: 14px; flex-shrink: 0; }
  .nav-label { flex: 1; white-space: nowrap; }

  .drawer-overlay {
    display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.4);
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 164px; background: var(--bg); border-right: 1px solid var(--accent);
    display: flex; overflow: hidden;
  }
  .drawer .left-rail { border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .drawer .nav-panel  { flex: 1; overflow-y: auto; }
  @media (max-width: 900px) {
    .nav-panel { width: 52px; }
    .nav-label { display: none !important; }
    .nav-panel .nav-link { padding: 12px 0; justify-content: center; border-left: none; }
    .nav-icon { font-size: 18px; }
  }
  @media (max-width: 600px) {
    body[data-layout="rail"] .left-rail { display: none; }
    .nav-panel { display: none !important; }

    .header-inner { padding: 10px 14px !important; gap: 12px; }
    .header-left { padding: 8px 14px; }
    h1 { font-size: 20px; }
    .header-label { font-size: 9px; }
    .header-sub { font-size: 9px; }
    .container { padding: 12px 14px; }
  }
</style>

<div class="page-body">
<div class="page-main">
<div class="container">

  

  <div id="signals-root">
    <div style="text-align:center;padding:60px;font-family:'IBM Plex Mono',monospace;color:var(--muted);">Loading signals…</div>
  </div>
</div>

<script src="all-data.js"></script>
<script>
  /* #88: every live signal run, merged. A stock picked by several runs shows once, with every run that
     picked it; its strongest pick (highest confidence, then best rank) leads. The S&P 500 / Nasdaq-100
     pages are derived from the sector runs, so they are not read here. */
  const RUNS = [
    { name: 'AI', path: '../AI' }, { name: 'Defence', path: '../Defence' }, { name: 'Crypto', path: '../Crypto' },
    { name: 'FTSE 100', path: '../markets/ftse100' },
    ...['Communication Services', 'Consumer Discretionary', 'Consumer Staples', 'Energy', 'Financials', 'Health Care',
        'Industrials', 'Materials', 'Real Estate', 'Technology', 'Utilities']
      .map(n => ({ name: n, path: '../sectors/' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-') })),
  ];
  const key = t => (typeof ASSET_YAHOO !== 'undefined' && ASSET_YAHOO[t]) || t;
  const STOCK = {};
  ((window.ALL_DATA && window.ALL_DATA.stocks) || []).forEach(s => { STOCK[key(s.ticker)] = s; });
  let merged = [], momentum = [];

  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const pill = sig => sig === 'strong_buy' ? 'STRONG BUY' : String(sig || '').replace('_', ' ').toUpperCase();

  function card(m, i) {
    const s = m.stock || {}, best = m.picks[0];
    let h = '<div class="signal-card">';
    h += '<div class="rank-num">' + (i + 1) + '</div><div class="signal-body">';
    h += '<div class="signal-ticker"><a href="' + esc(assetUrl(m.ticker)) + '" target="_blank" rel="noopener">' + esc(m.ticker) + '</a></div>';
    h += '<div class="signal-name">' + esc(s.company_name || m.ticker) + '</div>';
    h += '<div class="signal-badges">';
    if (s.sector) h += '<span class="sector-badge">' + esc(s.sector) + '</span>';
    h += '<span class="cat-badge">' + esc(pill(best.signal)) + ' · ' + Math.round((best.confidence || 0) * 100) + '%</span>';
    if (s.t212 === 'no') h += '<span class="cat-badge" title="Trading 212 does not list this stock">not on T212</span>';
    h += '</div>';
    h += '<div class="signal-score">Picked by: ' + m.picks.map(p =>
      '<a href="' + esc(p.path) + '/signals.html">' + esc(p.run) + ' #' + esc(p.rank) + '</a>').join(' · ') + '</div>';
    if (best.rationale) h += '<div class="signal-score">' + esc(best.rationale) + '</div>';
    h += '</div></div>';
    return h;
  }

  function renderAll() {
    const root = document.getElementById('signals-root');
    const shown = merged.filter(m => afMatch(m.stock || { ticker: m.ticker, markets: [], themes: [] }));
    document.getElementById('pick-total').textContent = merged.length;
    let html = '<div class="how-toggle" onclick="toggleHow(this)"><span class="toggle-icon">▶</span> How it works</div>';
    html += '<div class="how-box">Each of the 15 AI runs picks up to 10 stocks from its own list: the 11 sectors, the FTSE 100, and the AI, Defence and Crypto themes. '
      + 'Picks are updated Monday, Wednesday and Friday at 08:00 London time. A stock picked by several runs shows once; the run most confident about it comes first. '
      + 'The S&amp;P 500 and Nasdaq-100 pages show the sector runs’ picks that are members, so they are not separate runs. '
      + 'These are candidates to research, not recommendations: so far picks have roughly matched the S&amp;P 500 (see the <a href="../track-record.html">Track Record</a>). <strong>Not financial advice.</strong></div>';
    html += '<div class="section-label">AI candidates (' + shown.length + (shown.length !== merged.length ? ' of ' + merged.length : '') + ')</div>';
    html += shown.length ? '<div class="picks-grid">' + shown.map(card).join('') + '</div>'
                         : '<div class="empty-block">No picks match these filters.</div>';
    const mom = momentum.filter(m => afMatch(m.stock || { ticker: m.ticker, markets: [], themes: [] }));
    if (mom.length) {
      html += '<div class="momentum-section"><div class="section-label" title="Not picked by the AI: listed only because they have already risen a lot. On the track record these did worst.">Already up a lot — not buy signals</div><div class="momentum-grid">';
      html += mom.map(m => '<div class="momentum-card"><div class="momentum-ticker">' + esc(m.ticker) + '</div><div class="momentum-name">'
        + esc((m.stock || {}).company_name || m.ticker) + '</div><div class="momentum-score">' + esc(m.runs.join(' · ')) + '</div></div>').join('');
      html += '</div></div>';
    }
    root.innerHTML = html;
  }

  function toggleHow(el) {
    el.classList.toggle('open');
    const box = el.nextElementSibling;
    if (box) box.classList.toggle('open');
  }

  // Wait for shared.js (deferred) and nav.js: buildTape and fmtDate live there (same bug as #68)
  window.addEventListener('DOMContentLoaded', () => Promise.all(RUNS.map(r =>
    fetch(r.path + '/signals-local.json').then(x => x.json()).then(d => ({ ...r, data: d })).catch(() => ({ ...r, data: null }))
  )).then(results => {
    const byKey = {}, momByKey = {};
    results.forEach(r => {
      if (!r.data) return;
      (r.data.picks || []).forEach(p => {
        const k = key(p.ticker);
        (byKey[k] = byKey[k] || { ticker: p.ticker, stock: STOCK[k], picks: [] }).picks.push({ ...p, run: r.name, path: r.path });
      });
      (r.data.momentum_picks || []).forEach(p => {
        const k = key(p.ticker);
        (momByKey[k] = momByKey[k] || { ticker: p.ticker, stock: STOCK[k], runs: [] }).runs.push(r.name);
      });
    });
    const strength = p => [-(p.confidence || 0), p.rank || 99];
    const cmp = (a, b) => { const x = strength(a), y = strength(b); return x[0] - y[0] || x[1] - y[1]; };
    merged = Object.values(byKey);
    merged.forEach(m => m.picks.sort(cmp));
    merged.sort((a, b) => cmp(a.picks[0], b.picks[0]) || b.picks.length - a.picks.length || a.ticker.localeCompare(b.ticker));
    momentum = Object.values(momByKey).filter(m => !byKey[key(m.ticker)]);
    if (typeof buildTape === 'function') buildTape(((window.ALL_DATA || {}).stocks || []).slice(0, 80));
    const sigUpdated = results.map(r => r.data?.updated).filter(Boolean).sort().pop() || '—';
    const sigTsEl = document.getElementById('signals-ts');
    if (sigTsEl) sigTsEl.textContent = typeof fmtDate === 'function' ? fmtDate(sigUpdated) : sigUpdated;
    afBuildBar(document.getElementById('af-bar'), renderAll);
    renderAll();
  }));

  function openDrawer()  { document.getElementById('drawer-overlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); }
</script>
