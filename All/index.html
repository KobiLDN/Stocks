<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&amp;family=IBM+Plex+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>

<style>
  .filter-bar {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    position: relative;
  }

  .filter-btn:hover { color: var(--accent); border-color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  .filter-btn[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    line-height: 1.5;
    width: 220px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    text-transform: none;
    letter-spacing: 0;
  }
  .filter-btn[data-tooltip]::before {
    content: '';
    position: absolute;
    bottom: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 1001;
  }
  .filter-btn:hover[data-tooltip]::after,
  .filter-btn:hover[data-tooltip]::before { opacity: 1; }

  .filter-btn[data-filter="ai"].active      { background: var(--accent);  border-color: var(--accent); }
  .filter-btn[data-filter="biotech"].active { background: var(--green);   border-color: var(--green);  color: var(--bg); }
  .filter-btn[data-filter="defence"].active { background: var(--rose);    border-color: var(--rose);   color: var(--bg); }
  .filter-btn[data-filter="tech"].active    { background: var(--indigo);  border-color: var(--indigo); color: #fff; }
  .filter-btn[data-filter="crypto"].active  { background: var(--gold);    border-color: var(--gold);   color: var(--bg); }
  .filter-btn[data-filter="energy"].active  { background: var(--amber);   border-color: var(--amber);  color: var(--bg); }
  .filter-btn[data-filter="megacap"].active { background: #f472b6; border-color: #f472b6; color: var(--bg); }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    margin-bottom: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    white-space: nowrap;
  }

  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--accent); }
  thead th.sort-asc::after  { content: ' ▲'; color: var(--accent); }
  thead th.sort-desc::after { content: ' ▼'; color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: default;
  }

  tbody tr:hover { background: var(--surface2); }
  tbody tr.hidden { display: none; }

  td {
    padding: 14px 16px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .ticker-link { text-decoration: none; color: inherit; }
  .ticker-link:hover .ticker { text-decoration: underline; opacity: 0.85; }

  .ticker {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
  }

  .exchange-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .cat-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .cat-memory        { background: rgba(192,132,252,0.15); color: var(--purple);  border: 1px solid rgba(192,132,252,0.3); }
  .cat-nuclear-ops   { background: rgba(255,107,53,0.15);  color: var(--accent2); border: 1px solid rgba(255,107,53,0.3); }
  .cat-smr           { background: rgba(57,255,20,0.1);    color: var(--green);   border: 1px solid rgba(57,255,20,0.25); }
  .cat-uranium       { background: rgba(255,215,0,0.1);    color: var(--gold);    border: 1px solid rgba(255,215,0,0.3); }
  .cat-power-infra   { background: rgba(0,212,255,0.1);    color: var(--accent);  border: 1px solid rgba(0,212,255,0.25); }
  .cat-dc-operators  { background: rgba(68,136,255,0.1);   color: var(--blue);    border: 1px solid rgba(68,136,255,0.25); }
  .cat-hyperscalers  { background: rgba(167,139,250,0.1);  color: var(--indigo);  border: 1px solid rgba(167,139,250,0.25); }
  .cat-ai-compute    { background: rgba(251,113,133,0.1);  color: var(--rose);    border: 1px solid rgba(251,113,133,0.25); }
  .cat-fibre-optical { background: rgba(45,212,191,0.1);   color: var(--teal);    border: 1px solid rgba(45,212,191,0.25); }
  .cat-dsp-semi      { background: rgba(245,158,11,0.1);   color: var(--amber);   border: 1px solid rgba(245,158,11,0.25); }
  .cat-test-equip    { background: rgba(148,163,184,0.1);  color: var(--slate);   border: 1px solid rgba(148,163,184,0.25); }
  .cat-materials     { background: rgba(163,230,53,0.1);   color: var(--lime);    border: 1px solid rgba(163,230,53,0.25); }

  .sector-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .sector-ai      { background: rgba(0,212,255,0.15);   color: var(--accent);  border: 1px solid rgba(0,212,255,0.3); }
  .sector-biotech { background: rgba(0,230,118,0.15);   color: var(--green);   border: 1px solid rgba(0,230,118,0.3); }
  .sector-defence { background: rgba(251,113,133,0.15); color: var(--rose);    border: 1px solid rgba(251,113,133,0.3); }
  .sector-tech    { background: rgba(167,139,250,0.15); color: var(--indigo);  border: 1px solid rgba(167,139,250,0.3); }
  .sector-crypto  { background: rgba(255,215,0,0.15);   color: var(--gold);    border: 1px solid rgba(255,215,0,0.3); }
  .sector-energy  { background: rgba(245,158,11,0.15);  color: var(--amber);   border: 1px solid rgba(245,158,11,0.3); }
  .sector-megacap { background: rgba(244,114,182,0.12); color: #f472b6; border: 1px solid rgba(244,114,182,0.3); }

  .price {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 17px;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .return-positive { color: #16a34a; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .return-mega     { color: #0284c7; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  html[data-theme="dark"] .return-mega { color: #ffd700; }
  .return-modest   { color: #0284c7; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .return-negative { color: #dc2626; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  tr[data-return^="-"] .return-modest,
  tr[data-return^="-"] .return-positive { color: #dc2626; }

  .range-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 160px;
  }

  .range-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 36px;
  }

  .range-bar-bg {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    min-width: 80px;
  }

  .range-fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .range-dot {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--accent);
  }

  .ytd-return { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .ytd-pos  { color: var(--green); }
  .ytd-neg  { color: var(--red); }
  .ytd-flat { color: var(--muted); }

  footer {
    margin-top: 48px;
    padding: 24px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  footer strong { color: var(--accent2); }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  tbody tr { animation: rowIn 0.3s ease both; }
  #stock-tbody.af-ready tr { animation: none; }
  /* ~720 rows, 9 columns: give the note room so rows don't grow tall; the table scrolls sideways */
  #stock-table .notes-text { display: block; min-width: 260px; max-width: 360px; font-size: 12px; line-height: 1.4; }
  #stock-table td:nth-child(4) { min-width: 90px; }   /* only the first load slides in; filtering doesn't replay it */
  tbody tr:nth-child(1)  { animation-delay: 0.05s; }
  tbody tr:nth-child(2)  { animation-delay: 0.08s; }
  tbody tr:nth-child(3)  { animation-delay: 0.11s; }
  tbody tr:nth-child(4)  { animation-delay: 0.14s; }
  tbody tr:nth-child(5)  { animation-delay: 0.17s; }
  tbody tr:nth-child(6)  { animation-delay: 0.20s; }
  tbody tr:nth-child(7)  { animation-delay: 0.23s; }
  tbody tr:nth-child(8)  { animation-delay: 0.26s; }
  tbody tr:nth-child(9)  { animation-delay: 0.29s; }
  tbody tr:nth-child(10) { animation-delay: 0.32s; }
  tbody tr:nth-child(n+11) { animation-delay: 0.35s; }

  .search-count-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; flex-shrink: 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .search-count-bar input {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 6px 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); outline: none; flex: 1; max-width: 360px;
  }
  .search-count-bar input:focus { border-color: var(--accent); }
  .search-count-bar .row-count {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--dim); white-space: nowrap; margin-left: auto;
  }
  .row-count span { color: var(--accent); font-weight: 700; }

  @media (max-width: 768px) {
    .container { padding: 16px 12px; }
    .nav-inner { padding: 8px 12px; flex-wrap: wrap; }
    .header-inner { padding-left: 27px; }
    .header-inner::before { left: 12px; }
    .filter-btn { font-size: 10px; padding: 6px 10px; letter-spacing: 0; }
    table { font-size: 12px; }
    thead th { padding: 10px 8px; font-size: 10px; }
    td { padding: 10px 8px; }
    .ticker { font-size: 13px; }
    .price  { font-size: 14px; }
    .exchange-badge { font-size: 9px; }
    table th:nth-child(7), table td:nth-child(7) { display: none; }
    table th:nth-child(8), table td:nth-child(8) { display: none; }
    table th:nth-child(9), table td:nth-child(9) { display: none; }
    .row-count { font-size: 11px; }
    footer { font-size: 10px; padding: 16px; }
  }
  /* ─── 3-Panel Layout ─── */
  body[data-layout="rail"] { flex-direction: row; }
  .right-side { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .nav-panel {
    width: 148px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--bg); display: flex; flex-direction: column;
    padding: 8px 0; overflow-y: auto; scrollbar-width: none;
  }
  .nav-panel::-webkit-scrollbar { display: none; }
  .nav-item { display: flex; flex-direction: column; }
  .nav-panel .nav-link {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; padding: 10px 14px; color: var(--dim);
    border: none; border-left: 2px solid transparent; text-decoration: none;
    display: flex; align-items: center; gap: 8px; transition: all 0.15s;
    cursor: pointer; background: none; width: 100%; text-align: left;
  }
  .nav-panel .nav-link.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface2); }
  .nav-panel .nav-link:hover  { color: var(--accent); background: var(--surface2); }
  .nav-icon  { font-size: 14px; flex-shrink: 0; }
  .nav-label { flex: 1; white-space: nowrap; }

  .drawer-overlay {
    display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.4);
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 164px; background: var(--bg); border-right: 1px solid var(--accent);
    display: flex; overflow: hidden;
  }
  .drawer .left-rail { border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .drawer .nav-panel  { flex: 1; overflow-y: auto; }
  @media (max-width: 900px) {
    .nav-panel { width: 52px; }
    .nav-label { display: none !important; }
    .nav-panel .nav-link { padding: 12px 0; justify-content: center; border-left: none; }
    .nav-icon { font-size: 18px; }
    .header-blocks { display: none; }
  }
  @media (max-width: 600px) {
    body[data-layout="rail"] .left-rail { display: none; }
    .nav-panel { display: none !important; }

    .header-inner { padding: 10px 14px !important; gap: 12px; }
    .header-left { padding: 8px 14px; }
    h1 { font-size: 20px; }
    .header-label { font-size: 9px; }
    .header-sub { font-size: 9px; }
    .container { padding: 12px 14px; }
  }
</style>

<script>
/* All stocks (#88): one data file (all-data.js), filters in all-filters.js, 50 rows at a time.
   Rows are drawn from an array, not sorted in the DOM, so ~720 stocks stay quick on a phone. */
const NOTES = SECTOR_DATA.notes;
const STOCKS = (window.ALL_DATA && window.ALL_DATA.stocks) || [];
const PAGE = 50;
let shown = PAGE;
let sortState = { col: 'return', dir: -1 };

// One colour per standard sector (same order as the sector pages' palette)
const SECTOR_COLOR = {
  'Technology': 'var(--accent)', 'Health Care': 'var(--purple)', 'Financials': 'var(--teal)',
  'Consumer Discretionary': 'var(--rose)', 'Communication Services': 'var(--blue)', 'Industrials': 'var(--green)',
  'Consumer Staples': 'var(--amber)', 'Energy': 'var(--gold)', 'Utilities': 'var(--lime)',
  'Real Estate': 'var(--indigo)', 'Materials': 'var(--red)',
};
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g, '')); return isNaN(n) ? -Infinity : n; };
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function returnClass(retStr) {
  const n = num(retStr);
  if (n >= 200) return 'return-mega';
  if (n >= 50)  return 'return-positive';
  return 'return-modest';
}
function pillClass(v) { const n = parseFloat(v); return n > 0 ? 'pos' : n < 0 ? 'neg' : 'flat'; }
function ytdClass(v)  { const n = parseFloat(v); return n > 0 ? 'ytd-pos' : n < 0 ? 'ytd-neg' : 'ytd-flat'; }
function noteFor(s) {
  for (const t of s.themes || []) { const n = (NOTES[t] || {})[s.ticker]; if (n) return n; }
  return '';
}
function sectorLabel(s) { return s.sector || (s.markets || []).includes('crypto') && 'Crypto' || '—'; }

function rowHTML(s) {
  const color = SECTOR_COLOR[s.sector] || 'var(--gold)';
  const exDisp = s.exchange === 'TSE' ? 'TSE (Tokyo)' : (s.exchange || '');
  const themes = (s.themes || []).map(t => '<span class="af-tag">' + esc(AF_THEME_LABEL[t] || t) + '</span>').join('');
  const t212 = s.t212 === 'no' ? '<span class="af-t212-no" title="Trading 212 doesn\'t offer this">not on T212</span>' : '';
  return '<tr>' +
    '<td><a class="ticker-link" href="' + assetUrl(s.ticker) + '" target="_blank" rel="noopener">' +
      '<div class="ticker" style="color:' + color + '">' + esc(s.ticker) + '</div></a>' +
      '<div class="exchange-badge">' + esc(exDisp) + '</div>' + t212 + '</td>' +
    '<td>' + esc(s.company_name || s.ticker) + '</td>' +
    '<td><span class="sector-badge" style="color:' + color + ';border-color:' + color + '">' + esc(sectorLabel(s)) + '</span></td>' +
    '<td>' + (themes || '<span class="af-none">—</span>') + '</td>' +
    '<td><span class="price">$' + fmtUsd(s.price_usd) + '</span>' +
      '<div class="change-pills">' +
        '<span class="cpill ' + pillClass(s.change_1d) + '">' + esc(s.change_1d) + ' 1D</span>' +
        '<span class="cpill ' + pillClass(s.change_1w) + '">' + esc(s.change_1w) + ' 1W</span>' +
        '<span class="cpill ' + pillClass(s.change_1m) + '">' + esc(s.change_1m) + ' 1M</span>' +
      '</div></td>' +
    '<td><span class="' + returnClass(s.return_1yr) + '">' + esc(s.return_1yr) + '</span></td>' +
    '<td><span class="ytd-return ' + ytdClass(s.change_ytd) + '">' + esc(s.change_ytd) + '</span></td>' +
    '<td><div class="range-wrap">' +
      '<span class="range-label">$' + fmtUsd(s.low_usd) + '</span>' +
      '<div class="range-bar-bg">' +
        '<div class="range-fill" style="width:' + s.bar_pct + '%"></div>' +
        '<div class="range-dot" style="left:' + s.bar_pct + '%"></div>' +
      '</div>' +
      '<span class="range-label" style="text-align:right">$' + fmtUsd(s.high_usd) + '</span>' +
    '</div></td>' +
    '<td><span class="notes-text">' + esc(noteFor(s)) + '</span></td>' +
  '</tr>';
}

const SORT_KEY = {
  ticker: s => s.ticker, company: s => s.company_name || s.ticker, sector: s => sectorLabel(s),
  themes: s => (s.themes || []).join(' ') || '~', price: s => num(s.price_usd), return: s => num(s.return_1yr),
  ytd: s => num(s.change_ytd), range: s => num(s.bar_pct), angle: s => noteFor(s) || '~',
};

function sortTable(col, th) {
  if (sortState.col === col) sortState.dir *= -1;
  else { sortState.col = col; sortState.dir = (col === 'ticker' || col === 'company' || col === 'sector' || col === 'themes' || col === 'angle') ? 1 : -1; }
  document.querySelectorAll('thead th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
  if (th) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
  shown = PAGE;
  render();
}

function render() {
  const key = SORT_KEY[sortState.col] || SORT_KEY.return;
  const list = STOCKS.filter(afMatch).sort((a, b) => {
    const av = key(a), bv = key(b);
    return (typeof av === 'string' ? av.localeCompare(bv) : av - bv) * sortState.dir;
  });
  const tbody = document.getElementById('stock-tbody');
  tbody.innerHTML = list.length
    ? list.slice(0, shown).map(rowHTML).join('')
    : '<tr><td colspan="9" class="af-empty">No stocks match these filters.</td></tr>';
  document.getElementById('visible-count').textContent = list.length;
  const more = document.getElementById('af-more');
  const left = list.length - shown;
  more.hidden = left <= 0;
  more.textContent = 'Show ' + Math.min(PAGE, left) + ' more (' + left + ' not shown)';
}

window.addEventListener('DOMContentLoaded', () => {
  const data = window.ALL_DATA || {};
  const updated = data.updated;
  document.getElementById('total-count').textContent = STOCKS.length;
  const headerSc = document.getElementById('sector-count'); if (headerSc) headerSc.textContent = STOCKS.length;
  const headerTs = document.getElementById('data-bar-ts'); if (headerTs && updated) headerTs.textContent = fmtDate(updated);
  afBuildBar(document.getElementById('af-bar'), () => { shown = PAGE; render(); });
  afHookSearch(document.getElementById('stock-search'), () => { shown = PAGE; render(); });
  document.getElementById('af-more').onclick = () => { shown += PAGE; render(); };
  const th = document.querySelector('th[onclick*="\'return\'"]');
  if (th) th.classList.add('sort-desc');
  render();
  setTimeout(() => document.getElementById('stock-tbody').classList.add('af-ready'), 1500);
  // ticker tape: the 60 largest companies (the full list would be ~1,400 tape items)
  buildTape([...STOCKS].sort((a, b) => (b.market_cap_usd_b || 0) - (a.market_cap_usd_b || 0)).slice(0, 60));
});
  function openDrawer()  { document.getElementById('drawer-overlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); }
</script>
