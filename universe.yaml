# Master list of every tracked asset — the single source of truth (rebuild step 2, #54).
#
# assets:  one entry per asset, listed once even if it is in several sectors.
#   name, exchange, yahoo (Yahoo Finance symbol)
#   special: lse_pence (London price in pence) | jpy | sar — price conversion handling
#   speculative: true — flagged as speculative on the sector pages
#   crypto only: cmc_symbol, cmc_id (CoinMarketCap numeric ID), coingecko (CoinGecko ID)
#
# sectors: each sector's members in display order, as [ticker, category in that sector].
#
# retired: assets no longer on any page but named by past signals. Kept only so the
#   track record can still price those signals ("every signal counts", #54). Same fields
#   as assets; never shown on the site.
#
# Adding a stock: add it under assets (if new), then add [ticker, category] to each sector it belongs to.
# Checked by `python universe.py` (also run in CI).

